<!doctype html>
<html lang="ro">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#08111f" />
    <title>ORBYVEN — Offline</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
        background: radial-gradient(circle at top, #15233d 0%, #08111f 48%, #04080f 100%);
        color: #f8fafc;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        width: min(100%, 420px);
        text-align: center;
        padding: 32px 24px;
        border: 1px solid rgba(255,255,255,.1);
        border-radius: 28px;
        background: rgba(255,255,255,.055);
        backdrop-filter: blur(18px);
        box-shadow: 0 24px 80px rgba(0,0,0,.28);
      }
      img { width: 84px; height: 84px; border-radius: 22px; margin-bottom: 18px; }
      h1 { margin: 0 0 10px; font-size: 24px; letter-spacing: -.03em; }
      p { margin: 0 0 24px; color: #b8c2d4; line-height: 1.55; }
      button {
        appearance: none;
        border: 0;
        border-radius: 999px;
        padding: 13px 22px;
        font: inherit;
        font-weight: 700;
        color: #08111f;
        background: #f8fafc;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/branding/orbyven-app-icon.png" alt="" />
      <h1>ORBYVEN este offline</h1>
      <p>Conectează-te la internet și reîncearcă. Datele private ale workspace-ului nu sunt salvate în cache-ul offline.</p>
      <button type="button" onclick="location.reload()">Reîncearcă</button>
    </main>
  </body>
</html>
