name: Security Fix Sharp

on:
  push:
    branches:
      - fix/sharp-cve-2026-96889

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/sharp-cve-2026-96889
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Upgrade vulnerable sharp runtime dependency
        run: npm install sharp@0.35.5 --save-exact
      - name: Verify runtime dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Commit remediation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix(security): upgrade sharp to 0.35.5"
          git push
