name: ORBYVEN Windows Alpha Release

on:
  push:
    branches:
      - main
    paths:
      - "desktop/**"
      - "components/WorkspaceShell.tsx"
      - "lib/workspace-i18n.ts"
      - ".github/workflows/desktop-release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install desktop dependencies
        run: npm install --prefix desktop --no-audit --no-fund

      - name: Validate desktop
        run: npm run check --prefix desktop

      - name: Build branded Windows installer
        run: npm run build --prefix desktop

      - name: Prepare stable installer asset
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          $installer = Get-ChildItem "desktop/src-tauri/target/release/bundle/nsis/*-setup.exe" | Select-Object -First 1
          if (-not $installer) { throw "Windows installer not found" }
          Copy-Item $installer.FullName "release/ORBYVEN-Windows-Setup.exe" -Force

      - name: Publish stable Alpha download
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f desktop-latest "$GITHUB_SHA"
          git push origin -f desktop-latest

          if gh release view desktop-latest >/dev/null 2>&1; then
            gh release upload desktop-latest release/ORBYVEN-Windows-Setup.exe --clobber
            gh release edit desktop-latest               --title "ORBYVEN Desktop Windows Alpha"               --notes "Latest ORBYVEN Windows Alpha build. Unsigned preview build for testing."
          else
            gh release create desktop-latest               release/ORBYVEN-Windows-Setup.exe               --title "ORBYVEN Desktop Windows Alpha"               --notes "Latest ORBYVEN Windows Alpha build. Unsigned preview build for testing."               --prerelease               --target "$GITHUB_SHA"
          fi
