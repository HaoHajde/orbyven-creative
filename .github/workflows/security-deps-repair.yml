name: ORBYVEN Security Dependency Repair

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/security-deps-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Patch vulnerable runtime dependencies
        run: |
          set -euo pipefail
          npm install next@16.3.8 --save-exact --package-lock-only
          npm audit fix --package-lock-only --omit=dev
          npm ci
          npm audit --omit=dev --audit-level=high

      - name: Commit repaired dependency lock
        run: |
          set -euo pipefail
          git config user.name "ORBYVEN Security Bot"
          git config user.email "security-bot@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes required."
            exit 0
          fi
          git commit -m "security: patch vulnerable runtime dependencies"
          git push origin HEAD:main
