name: ORBYVEN One-Off Integrity Maintenance

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/security-deps-repair.yml

permissions:
  contents: write

jobs:
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Align Next tooling and modernize permanent Actions runtime
        run: |
          set -euo pipefail
          npm install eslint-config-next@16.3.8 --save-dev --save-exact --package-lock-only
          npm ci
          npm audit --omit=dev --audit-level=high

          while IFS= read -r -d '' file; do
            sed -i 's#actions/checkout@v4#actions/checkout@v7#g; s#actions/setup-node@v4#actions/setup-node@v7#g' "$file"
          done < <(find .github/workflows -type f \( -name '*.yml' -o -name '*.yaml' \) ! -name 'security-deps-repair.yml' -print0)

      - name: Commit maintenance changes
        run: |
          set -euo pipefail
          git config user.name "ORBYVEN Integrity Bot"
          git config user.email "integrity-bot@users.noreply.github.com"
          git add package.json package-lock.json .github/workflows
          git reset .github/workflows/security-deps-repair.yml
          if git diff --cached --quiet; then
            echo "No maintenance changes required."
            exit 0
          fi
          git commit -m "chore: align Next tooling and modernize GitHub Actions"
          git push origin HEAD:main
