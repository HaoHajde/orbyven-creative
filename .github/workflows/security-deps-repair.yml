name: ORBYVEN One-Off Package Alignment

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/security-deps-repair.yml

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Align Next tooling
        run: |
          set -euo pipefail
          npm install eslint-config-next@16.3.8 --save-dev --save-exact --package-lock-only
          npm ci
          npm audit --omit=dev --audit-level=high

      - name: Commit package alignment
        run: |
          set -euo pipefail
          git config user.name "ORBYVEN Integrity Bot"
          git config user.email "integrity-bot@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No package alignment required."
            exit 0
          fi
          git commit -m "chore: align Next lint tooling"
          git push origin HEAD:main
