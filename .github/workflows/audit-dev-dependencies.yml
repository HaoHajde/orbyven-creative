name: Audit development dependencies

on:
  push:
    branches:
      - audit/dev-dependencies-20261009

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Full dependency audit
        run: npm audit --audit-level=high
