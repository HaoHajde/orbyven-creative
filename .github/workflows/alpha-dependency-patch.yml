name: ORBYVEN Alpha Dependency Patch

on:
  push:
    branches:
      - security/alpha-dependency-patch

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[deps-generated]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-key
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@v4
        with:
          ref: security/alpha-dependency-patch

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install current lockfile
        run: npm ci

      - name: Patch Next.js toolchain
        run: npm install next@16.3.3 eslint-config-next@16.3.3 --save-exact

      - name: Relock patched Sharp
        run: npm update sharp --package-lock-only

      - name: Relock patched js-yaml
        run: npm update js-yaml --package-lock-only

      - name: Reinstall patched dependency tree
        run: npm ci

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Validate application
        run: npm run validate

      - name: Commit generated lockfile
        run: |
          set -euo pipefail
          git config user.name "ORBYVEN Foundation Bot"
          git config user.email "actions@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes generated."
            exit 0
          fi
          git commit -m "Patch Alpha Foundation dependencies [deps-generated]"
          git push origin HEAD:security/alpha-dependency-patch
