name: ORBYVEN Manual Browser Performance Audit

# Public and unauthenticated auth routes only. Does not deploy or access private data.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/performance-audit.yml'
      - 'app/**'
      - 'components/**'
      - 'scripts/audit-public-layout.mjs'
      - 'tests/device-integrity.test.mjs'

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-key
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install and build
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.55.0
          npm run build
      - name: Install Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
      - name: Register Chrome path
        run: echo "CHROME_PATH=${{ steps.chrome.outputs.chrome-path }}" >> "$GITHUB_ENV"
      - name: Audit local production build on mobile and desktop
        run: |
          set -euo pipefail
          npm run start -- --hostname 127.0.0.1 --port 3000 > /tmp/orbyven-next.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3000/ > /dev/null; then break; fi
            sleep 2
          done
          for route in templates workspace/login workspace/register workspace/forgot-password workspace/reset-password admin/login control-center/login; do
            curl -fsS "http://127.0.0.1:3000/$route" > /dev/null
          done
          node scripts/audit-public-layout.mjs
          mkdir -p lighthouse
          npm exec --yes --package=lighthouse@12 -- lighthouse --version
          # Only synthetic unauthenticated entry pages; DO NOT claim this
          # captures real login, onboarding or authenticated dashboard UX.
          for page in home templates workspace-login workspace-register workspace-forgot workspace-reset admin-login control-center-login; do
            case "$page" in
              home) path="/" ;;
              templates) path="/templates" ;;
              workspace-login) path="/workspace/login" ;;
              workspace-register) path="/workspace/register" ;;
              workspace-forgot) path="/workspace/forgot-password" ;;
              workspace-reset) path="/workspace/reset-password" ;;
              admin-login) path="/admin/login" ;;
              control-center-login) path="/control-center/login" ;;
            esac
            for device in mobile desktop; do
              preset=""
              if [ "$device" = "desktop" ]; then preset="--preset=desktop"; fi
              npm exec --yes --package=lighthouse@12 -- lighthouse "http://127.0.0.1:3000$path" \
                --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
                --only-categories=performance,accessibility \
                --output=json --output-path="lighthouse/${page}-${device}.json" \
                --quiet $preset
            done
          done
          node scripts/summarize-lighthouse.mjs lighthouse
      - name: Upload raw audit data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbyven-lighthouse-${{ github.sha }}
          path: lighthouse/
          if-no-files-found: warn
          retention-days: 14
