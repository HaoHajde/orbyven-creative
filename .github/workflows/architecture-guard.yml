name: ORBYVEN Architecture Guard

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  ownership:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4

      - name: Read PR ownership and changed files
        id: context
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          labels="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json labels --jq '[.labels[].name]')"
          owner_labels="$(echo "$labels" | jq -c '[.[] | select(test("^chat-[1-4]-"))]')"
          owner_count="$(echo "$owner_labels" | jq 'length')"
          owner="$(echo "$owner_labels" | jq -r '.[0] // ""')"
          override="false"
          if echo "$labels" | jq -e 'index("architecture-cross-domain-approved") != null' >/dev/null; then
            override="true"
          fi

          changed_files="$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --jq '.[].filename' | jq -R -s -c 'split("\n") | map(select(length > 0))')"

          echo "owner=$owner" >> "$GITHUB_OUTPUT"
          echo "owner_count=$owner_count" >> "$GITHUB_OUTPUT"
          echo "override=$override" >> "$GITHUB_OUTPUT"
          echo "changed_files=$changed_files" >> "$GITHUB_OUTPUT"

      - name: Enforce ownership boundaries
        env:
          ORBYVEN_OWNER: ${{ steps.context.outputs.owner }}
          ORBYVEN_OWNER_COUNT: ${{ steps.context.outputs.owner_count }}
          ORBYVEN_ARCHITECTURE_OVERRIDE: ${{ steps.context.outputs.override }}
          ORBYVEN_CHANGED_FILES: ${{ steps.context.outputs.changed_files }}
        run: node scripts/check-architecture.mjs
