name: ORBYVEN Quality Gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: orbyven-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-key
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Runtime dependency security audit
        run: npm audit --omit=dev --audit-level=high

      - name: Collect changed lint targets
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE_SHA"
            head="$PR_HEAD_SHA"
          else
            base="$PUSH_BEFORE_SHA"
            head="$PUSH_HEAD_SHA"
          fi

          git diff --name-only --diff-filter=ACMR "$base" "$head" --             '*.js' '*.jsx' '*.ts' '*.tsx' '*.mjs' '*.cjs' > /tmp/orbyven-lint-targets.txt

          echo "Changed lint targets:"
          cat /tmp/orbyven-lint-targets.txt || true

      - name: Lint changed code
        run: |
          set -euo pipefail

          if [ ! -s /tmp/orbyven-lint-targets.txt ]; then
            echo "No changed JavaScript/TypeScript files to lint."
            exit 0
          fi

          mapfile -t files < /tmp/orbyven-lint-targets.txt
          npx eslint "${files[@]}"

      - name: Full lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Architecture and lightweight source gate
        run: npm run test:architecture

      - name: Ecosystem · core contract
        run: node --experimental-strip-types --test tests/ecosystem-contract.test.mjs

      - name: Ecosystem · thermal planner
        run: node --experimental-strip-types --test tests/thermal-planner-live.test.mjs

      - name: Ecosystem · finance activity
        run: node --experimental-strip-types --test tests/finance-activity-contract.test.mjs

      - name: Ecosystem · intelligence core
        run: node --experimental-strip-types --test tests/intelligence-core.test.mjs

      - name: Ecosystem · web design AI
        run: node --experimental-strip-types --test tests/web-design-ai.test.mjs

      - name: Ecosystem · AI agent actions
        run: node --experimental-strip-types --test tests/ai-agent-actions.test.mjs

      - name: Ecosystem · AI estimate action
        run: node --experimental-strip-types --test tests/ai-estimate-action.test.mjs

      - name: Ecosystem · AI document action
        run: node --experimental-strip-types --test tests/ai-document-action.test.mjs

      - name: Ecosystem · AI conversation memory
        run: node --experimental-strip-types --test tests/ai-conversation-memory.test.mjs

      - name: Ecosystem · AI context followups
        run: node --experimental-strip-types --test tests/ai-context-followups.test.mjs

      - name: Ecosystem · AI selective language
        run: node --experimental-strip-types --test tests/ai-selective-language.test.mjs

      - name: Ecosystem · AI entity context
        run: node --experimental-strip-types --test tests/ai-entity-context.test.mjs

      - name: Ecosystem · automation business signals
        run: node --experimental-strip-types --test tests/automation-business-signals.test.mjs

      - name: Ecosystem · inventory procurement
        run: node --experimental-strip-types --test tests/inventory-procurement.test.mjs

      - name: Ecosystem · resource scheduler
        run: node --experimental-strip-types --test tests/resource-scheduler.test.mjs

      - name: Ecosystem · AI plan mode
        run: node --experimental-strip-types --test tests/ai-plan-mode.test.mjs

      - name: Ecosystem · intelligence floating overlay
        run: node --experimental-strip-types --test tests/intelligence-floating-overlay.test.mjs

      - name: Ecosystem · PWA install contract
        run: node --experimental-strip-types --test tests/pwa-install-contract.test.mjs

      - name: Ecosystem · workspace warp navigation
        run: node --experimental-strip-types --test tests/workspace-warp-navigation.test.mjs

      - name: Ecosystem · workspace mobile PWA polish
        run: node --experimental-strip-types --test tests/workspace-mobile-pwa-polish.test.mjs

      - name: Ecosystem · client retention aftercare
        run: node --experimental-strip-types --test tests/client-retention-aftercare.test.mjs

      - name: Ecosystem · post-service growth
        run: node --experimental-strip-types --test tests/post-service-growth.test.mjs

      - name: Billing webhook and fiscal regression tests (offline)
        run: npm run test:billing

      - name: Security hardening regression tests (offline)
        run: npm run test:security

      - name: Legal & Trust regression tests (offline)
        run: npm run test:compliance

      - name: B2B order evidence regression tests (offline)
        run: npm run test:orders

      - name: Demo template integrity (offline)
        run: node --test tests/pilot-demo-integrity.test.mjs

      - name: Performance · boundaries
        run: node --test tests/performance-boundaries.test.mjs

      - name: Performance · workspace auth
        run: node --test tests/workspace-auth-performance.test.mjs

      - name: Performance · device integrity
        run: node --test tests/device-integrity.test.mjs

      - name: Data efficiency and search regression tests (offline)
        run: npm run test:data

      - name: SEO regression tests
        run: npm run test:seo

      - name: Production build
        run: npm run build

      - name: Built client JavaScript budget
        run: node scripts/architecture-integrity.mjs --web-build-only
