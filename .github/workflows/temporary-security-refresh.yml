name: ORBYVEN Temporary Security Dependency Refresh

on:
  push:
    branches:
      - hardening/project-integrity-20261002

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/project-integrity-20261002
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Upgrade security-patched Next.js
        run: |
          npm install --package-lock-only --save-exact next@16.3.8
          npm install --package-lock-only --save-dev --save-exact eslint-config-next@16.3.8
      - name: Verify high/critical audit
        run: npm audit --audit-level=high
      - name: Commit lockfile refresh
        run: |
          git config user.name "orbyven-security-bot"
          git config user.email "actions@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes required."
            exit 0
          fi
          git commit -m "Upgrade Next.js security release"
          git push origin HEAD:hardening/project-integrity-20261002
