name: Development dependency nonbreaking fix

on:
  push:
    branches:
      - fix/dev-audit-nonbreaking-20261009

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/dev-audit-nonbreaking-20261009
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply npm nonbreaking security fixes to lockfile
        run: npm audit fix --package-lock-only || true
      - name: Verify production runtime remains clean
        run: npm audit --omit=dev --audit-level=high
      - name: Validate project after lockfile repair
        run: npm run validate
      - name: Report remaining development advisories
        run: npm audit --audit-level=high || true
      - name: Commit repaired lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix(security): apply nonbreaking development dependency patches"
          git push
