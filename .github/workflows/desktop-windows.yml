name: ORBYVEN Desktop Windows

on:
  pull_request:
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop-windows.yml'
      - 'app/icon.svg'
      - 'app/api/desktop/**'
      - 'lib/modules/**'
      - 'lib/orbyven-workspace.ts'
      - 'lib/workspace-visual-system.ts'
      - 'lib/orbyven-modules.ts'
      - 'lib/ai/**'
      - 'app/api/ai/**'
      - 'components/modules/**'
      - 'lib/automation/**'
      - 'lib/inventory/**'
      - 'lib/ecosystem/**'
      - 'lib/workspace-navigation.ts'
      - 'config/architecture-budgets.json'
      - 'scripts/architecture-integrity.mjs'
      - 'components/WorkspaceShell.tsx'
      - 'components/WorkspaceContent.tsx'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Rust stable for Windows
        uses: dtolnay/rust-toolchain@stable

      - name: Install Desktop dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: Shared architecture and lightweight source gate
        run: npm run test:architecture

      - name: Contract checks
        run: npm run check --prefix desktop

      - name: Build branded ORBYVEN Windows NSIS installer
        run: npm run build --prefix desktop

      - name: Desktop bundle and installer budget
        run: node scripts/architecture-integrity.mjs --desktop-build-only

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: ORBYVEN-Desktop-Windows-v0.8.0
          path: desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 14
